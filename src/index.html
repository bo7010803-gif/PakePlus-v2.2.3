<!DOCTYPE html>
<html>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:30px;">
  <h2>退出修复测试</h2>
  <button id="checkBtn">检查 __TAURI__</button>
  <button id="closeBtn" style="margin-left:20px;">关闭程序</button>
  <pre id="log" style="color:#0f0;"></pre>
  <script>
    const log = document.getElementById('log');
    document.getElementById('checkBtn').onclick = () => {
      if (window.__TAURI__) {
        log.textContent = '✅ TauriApi 已注入，可使用退出方法。';
      } else {
        log.textContent = '❌ TauriApi 未注入，请勾选打包配置中的 TauriApi。';
      }
    };
    document.getElementById('closeBtn').onclick = async () => {
      try {
        if (window.__TAURI__) {
          await window.__TAURI__.process.exit(0);
          return;
        }
      } catch (e) {}
      window.close();
      setTimeout(() => {
        log.textContent = '仍无法关闭，请手动 Alt+F4。';
      }, 500);
    };
  </script>
</body>
</html>
